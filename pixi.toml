[workspace]
authors = ["Michael Johnson <mjohnson459@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "rviz_teleop_panel"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

# Build this package into a conda artifact (ros-jazzy-rviz-teleop-panel) via the
# pixi-build-ros backend. Metadata and dependencies are read from package.xml.
[package.build.backend]
channels = ["https://prefix.dev/conda-forge"]
name = "pixi-build-ros"
version = "*"

[package.build.config]
distro = "jazzy"

[tasks]
build = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
# Build (if needed) then launch RViz2 with the panel available under
# Panels -> Add New Panel -> rviz_teleop_panel -> TeleopPanel.
rviz = { cmd = "bash -c 'source install/setup.sh && rviz2'", depends-on = ["build"] }

[dependencies]
# build tooling
cmake = ">=3.8"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=1.11.0,<2"
ninja = ">=1.13,<2"
pkg-config = ">=0.29,<0.30"

# package build dependencies (see package.xml)
ros-jazzy-ament-cmake = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-rviz-common = "*"
ros-jazzy-pluginlib = "*"

# for running / testing the panel
ros-jazzy-rviz2 = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"

[activation]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }
